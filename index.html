<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classes Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        smartNavy: '#001b3a',
                        smartRed: '#e3000f'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-smartNavy text-white flex flex-col shadow-xl h-full flex-shrink-0">
        <div class="p-6 border-b border-gray-700 text-center">
            <h1 class="text-2xl font-bold tracking-wider">SMART<span class="text-smartRed"> HUB</span></h1>
            <p class="text-xs text-gray-400 mt-1">Class Material Portal</p>
        </div>
        
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            <button data-level="A1" onclick="renderLevel('A1')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level A1</button>
            <button data-level="A2" onclick="renderLevel('A2')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level A2</button>
            <button data-level="B1" onclick="renderLevel('B1')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level B1</button>
            <button data-level="B2" onclick="renderLevel('B2')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level B2</button>
            <button data-level="C1" onclick="renderLevel('C1')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level C1</button>
        </nav>

        <div class="p-4 border-t border-gray-700 text-center">
            <p class="text-sm font-serif italic text-white/30 tracking-widest cursor-default select-none">
                Leonardo Pabon
            </p>
        </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto bg-gray-50 p-8">
        <div class="max-w-7xl mx-auto" id="content">
            <div class="flex flex-col items-center justify-center h-full text-center mt-20">
                <svg class="w-24 h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <h2 class="text-3xl font-bold text-gray-400">Welcome to Smart Hub</h2>
                <p class="text-gray-500 mt-2">Select a level from the sidebar to view its classes.</p>
            </div>
        </div>
    </main>

    <script>
        const levelConfig = {
            'A1': { type: 'A', blocks: 8, classesPerBlock: 9 }, 
            'A2': { type: 'A', blocks: 8, classesPerBlock: 9 }, 
            'B1': { type: 'A', blocks: 8, classesPerBlock: 9 }, 
            'B2': { type: 'B', blocks: 12, classesPerBlock: 7 }, 
            'C1': { type: 'C', blocks: 12, classesPerBlock: 7 }  
        };

        function renderLevel(levelName) {
            const config = levelConfig[levelName];
            const contentDiv = document.getElementById('content');
            
            document.querySelectorAll('.lvl-btn').forEach(btn => {
                btn.classList.remove('bg-smartRed');
                if(btn.dataset.level === levelName) {
                    btn.classList.add('bg-smartRed');
                }
            });

            let html = `
                <div class="mb-8">
                    <h2 class="text-4xl font-black text-smartNavy border-b-4 border-smartRed inline-block pb-2">Level ${levelName}</h2>
                </div>
                <div class="space-y-10">
            `;

            for (let i = 0; i < config.blocks; i++) {
                let unitTitle = (config.type === 'A') ? `Units ${i * 2 + 1} & ${i * 2 + 2}` : `Unit ${i + 1}`;

                html += `
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                        <div class="bg-smartNavy text-white px-6 py-4 flex justify-between items-center">
                            <h3 class="text-xl font-bold">${unitTitle}</h3>
                            <span class="bg-gray-700 text-xs px-3 py-1 rounded-full border border-gray-600">${config.classesPerBlock} Items</span>
                        </div>
                        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                `;

                for (let j = 1; j <= config.classesPerBlock; j++) {
                    let cardTitle = "";
                    let folderName = "";
                    let specialBadge = "";
                    let bgColor = "bg-gray-50";

                    if (config.type === 'A') {
                        let classNum = (i * 9) + j;
                        let fmt = classNum.toString().padStart(2, '0');
                        cardTitle = `Class ${fmt}`;
                        folderName = `Class-${fmt}`;
                        
                        if (j === 9) {
                            bgColor = "bg-red-50 border-red-200";
                            specialBadge = `<span class="inline-block bg-smartRed text-white text-xs font-bold px-2 py-1 rounded shadow-sm">🏆 Progress Check</span>`;
                        }
                    } 
                    else if (config.type === 'B') {
                        let classNum = (i * 7) + j;
                        let fmt = classNum.toString().padStart(2, '0');
                        cardTitle = `Class ${fmt}`;
                        folderName = `Class-${fmt}`;

                        if (j === 7) {
                            bgColor = "bg-blue-50 border-blue-200";
                            specialBadge = `<span class="inline-block bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">🎬 Video Class</span>`;
                        }
                    } 
                    else if (config.type === 'C') {
                        if (j <= 6) {
                            let classNum = (i * 6) + j;
                            let fmt = classNum.toString().padStart(2, '0');
                            cardTitle = `Class ${fmt}`;
                            folderName = `Class-${fmt}`;
                        } else {
                            let videoNum = i + 1;
                            let fmt = videoNum.toString().padStart(2, '0');
                            cardTitle = `Video ${fmt}`;
                            folderName = `Video-${fmt}`; // Nota: C1 usa carpeta Video-XX
                            
                            bgColor = "bg-blue-50 border-blue-200";
                            specialBadge = `<span class="inline-block bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">🎬 Video Class</span>`;
                        }
                    }

                    html += `
                        <div class="border rounded-lg p-5 hover:shadow-xl transition-all duration-300 flex flex-col justify-between ${bgColor}">
                            <div class="mb-4">
                                <h4 class="text-lg font-black text-gray-800 mb-2">${cardTitle}</h4>
                                ${specialBadge ? specialBadge : '<div class="h-6"></div>'}
                            </div>
                            
                            <div class="flex gap-2 mt-auto">
                                <a href="./${levelName}/${folderName}/warmup.html" target="_blank" class="flex-1 bg-white border-2 border-smartNavy text-smartNavy hover:bg-smartNavy hover:text-white font-bold text-center text-xs py-2 px-1 rounded transition-colors">
                                    WARM UP
                                </a>
                                <a href="./${levelName}/${folderName}/production.html" target="_blank" class="flex-1 bg-smartRed border-2 border-smartRed hover:bg-red-700 hover:border-red-700 text-white font-bold text-center text-xs py-2 px-1 rounded transition-colors">
                                    PRODUCTION
                                </a>
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            contentDiv.innerHTML = html;
        }
    </script>
</body>
</html>
